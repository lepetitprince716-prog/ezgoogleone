[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezgoogleone"
version = "0.1.0"
description = "Universal CLI toolkit and cross-agent skills for Gemini Web, Google AI Studio, Gemini API, and Google Colab"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
image = ["Pillow>=10.0"]
colab = ["google-colab-cli>=0.8.0"]
